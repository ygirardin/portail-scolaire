name: Compléments ULIS et SEGPA Onisep
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/enrichir-inclusion.py'
      - '.github/workflows/enrichir-inclusion.yml'
  schedule:
    - cron: '35 6 11 * *'
permissions:
  contents: write
concurrency:
  group: inclusion-onisep
  cancel-in-progress: false
jobs:
  importer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/enrichir-inclusion.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/inclusion-details-onisep.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Importer les champs professionnels et types explicites Onisep (ODbL)"
          git push origin HEAD:main
