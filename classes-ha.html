<!DOCTYPE html>
<html lang="fr" data-portal-page="map-light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carte CHA — Collèges publics France</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

  <style>
    :root {
      --accent:       #7e3af2;
      --accent-bg:    #f5f3ff;
      --accent-dark:  #4c1d95;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f9fafb; }
    body { display: flex; flex-direction: column; }

    header {
      display: flex; align-items: center; gap: 10px;
      padding: 0 14px; height: 50px;
      background: #fff; border-bottom: 1px solid #e5e7eb;
      flex-shrink: 0; z-index: 900;
    }
    .back { font-size: .8rem; font-weight: 600; color: #6b7280; text-decoration: none;
            padding: 4px 10px; border: 1px solid #e5e7eb; border-radius: 6px; }
    .back:hover { background: #f3f4f6; color: #111; }
    .htitle { font-size: .95rem; font-weight: 700; display: flex; align-items: center; gap: 7px; }
    .badge { background: var(--accent); color: #fff; font-size: .62rem; font-weight: 800;
             padding: 2px 7px; border-radius: 20px; letter-spacing: .05em; }
    #hcount { margin-left: auto; font-size: .78rem; color: #9ca3af; }

    .wrap { display: flex; flex: 1; overflow: hidden; }
    #map { flex: 1; position: relative; }

    #loading {
      position: absolute; inset: 0; z-index: 800;
      background: rgba(255,255,255,.88);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
      font-size: .9rem; color: #374151;
    }
    .spin {
      width: 34px; height: 34px; border-radius: 50%;
      border: 3px solid #e5e7eb; border-top-color: var(--accent);
      animation: spin .65s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .panel {
      width: 320px; flex-shrink: 0;
      background: #fff; border-left: 1px solid #e5e7eb;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .p-head { padding: 14px; border-bottom: 1px solid #e5e7eb; }
    .p-head h2 { font-size: .95rem; font-weight: 700; margin-bottom: 10px; }

    .search-wrap { position: relative; }
    .search-icon { position: absolute; left: 9px; top: 50%; transform: translateY(-50%);
                   font-size: .8rem; opacity: .45; pointer-events: none; }
    input[type=text] {
      width: 100%; padding: 7px 10px 7px 30px;
      border: 1px solid #e5e7eb; border-radius: 7px;
      font-size: .83rem; background: #f9fafb; outline: none;
    }
    input[type=text]:focus { border-color: var(--accent); background: #fff; }

    select {
      width: 100%; margin-top: 7px; padding: 7px 9px;
      border: 1px solid #e5e7eb; border-radius: 7px;
      font-size: .8rem; background: #f9fafb; cursor: pointer; outline: none;
    }
    select:focus { border-color: var(--accent); }

    .count-bar {
      padding: 8px 14px; font-size: .75rem; font-weight: 600;
      color: var(--accent-dark); background: var(--accent-bg);
      border-bottom: 1px solid #e5e7eb;
    }

    .list { flex: 1; overflow-y: auto; }
    .item {
      padding: 9px 14px; border-bottom: 1px solid #f3f4f6;
      cursor: pointer; transition: background .1s;
    }
    .item:hover { background: #f9fafb; }
    .item.active { background: var(--accent-bg); border-left: 3px solid var(--accent); padding-left: 11px; }
    .iname { font-size: .83rem; font-weight: 600; color: #111827; }
    .iloc  { font-size: .73rem; color: #9ca3af; margin-top: 1px; }
    .empty { padding: 28px 14px; text-align: center; color: #9ca3af; font-size: .83rem; }

    /* ── Popup enrichi ── */
    .pu-title { font-weight: 700; font-size: .9rem; margin-bottom: 5px; color: #111; }
    .pu-badge { display: inline-block; background: var(--accent); color: #fff;
                font-size: .62rem; font-weight: 800; padding: 2px 6px;
                border-radius: 4px; margin-bottom: 8px; }
    .pu-info  { font-size: .8rem; color: #555; line-height: 1.6; }
    .pu-contact { margin-top: 8px; padding-top: 8px; border-top: 1px solid #e5e7eb;
                  font-size: .78rem; display: flex; flex-direction: column; gap: 3px; }
    .pu-contact a { color: #1a56db; text-decoration: none; }
    .pu-contact a:hover { text-decoration: underline; }

    @media (max-width: 650px) { .panel { display: none; } }
  </style>
<link rel="stylesheet" href="portail-theme.css?v=20261119">
<link rel="stylesheet" href="portal-shell.css?v=20261119">
<script defer src="portal-shell.js?v=20261119"></script>
<style>
html,body{width:100%;height:100%;overflow:hidden}
body{height:100vh;height:100dvh}
body>header,.htitle,.wrap,#map{min-width:0}
.wrap,#map{min-height:0}
.htitle{flex-wrap:wrap}
#hcount{white-space:nowrap}
.panel{max-width:100%}
@media(max-width:700px){.wrap{flex-direction:column}.panel{flex-shrink:0}.htitle{font-size:.8rem}}
.data-notice{padding:9px 14px;font-size:.73rem;line-height:1.45;background:#fff5df;color:#75480b;border-bottom:1px solid #ead7ad}
</style>
<style>
.cha-import{display:grid;gap:5px;margin-top:9px;font-size:.7rem;color:#42506b}
.cha-import button{border:1px solid #c7c9f1;background:#eef0ff;color:#3638a6;border-radius:8px;padding:8px;font:inherit;font-weight:700;cursor:pointer}
.cha-import input{width:100%;font-size:.7rem}
#specialite{margin-top:6px;width:100%}
.cha-type{font-size:.68rem;color:#5444ad;font-weight:700;margin-top:4px}
</style><style>
.cha-badges{display:flex;gap:4px;flex-wrap:wrap;margin:5px 0}
.cha-badge{display:inline-flex;border:1px solid var(--cha-color);border-radius:7px;padding:3px 6px;color:var(--cha-color);background:white;font-size:.69rem;font-weight:700;line-height:1.3}
.cha-legend{padding:7px 12px;background:white;border-bottom:1px solid #e0e7f2;font-size:.71rem;color:#42506b;line-height:1.5}
.cha-legend summary{cursor:pointer;font-weight:700}
.cha-legend .cha-badges{margin-top:7px}
</style><script src="onisep-dispositifs.js?v=20261119"></script>
</head>
<body>
<a href="index.html" style="position:fixed;top:12px;right:14px;z-index:9999;display:inline-flex;align-items:center;gap:5px;background:rgba(15,23,42,.85);backdrop-filter:blur(6px);color:#fff;text-decoration:none;font-size:.76rem;font-weight:600;border:1px solid rgba(255,255,255,.15);border-radius:7px;padding:6px 13px;box-shadow:0 2px 12px rgba(0,0,0,.25);font-family:system-ui,sans-serif;letter-spacing:.01em;transition:background .15s" onmouseover="this.style.background='rgba(30,64,128,.9)'" onmouseout="this.style.background='rgba(15,23,42,.85)'">← Portail</a>

<header>
  <a class="back" href="index.html">← Accueil</a>
  <div class="htitle">
    <span>🎵</span><span>Classes à horaires aménagés</span>
    <span class="badge">CHA</span>
  </div>
  <span id="hcount">Chargement…</span>
</header>

<div class="wrap">
  <div id="map">
    <div id="loading"><div class="spin"></div><span>Chargement des établissements…</span></div>
  </div>

  <div class="panel">
    <div class="p-head">
      <h2>🎵 Classes à horaires aménagés</h2>
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input id="q" type="text" placeholder="Nom ou commune…" />
      </div>
      <select id="dept" aria-label="Département"></select>
      <select id="specialite" aria-label="Spécialité"><option value="">Toutes les spécialités</option></select>
      <div class="cha-import"><button id="cha-refresh" type="button">Charger le catalogue national Onisep</button><a href="https://www.data.gouv.fr/datasets/ideo-actions-de-dispositif" target="_blank" rel="noopener">Source officielle · ODbL</a><label for="cha-file">Ou importer le fichier GeoJSON Onisep téléchargé</label><input type="file" id="cha-file" accept=".geojson,.json,application/geo+json,application/json"></div>
    </div>
    <div class="data-notice" id="data-notice" hidden></div>
    <details class="cha-legend"><summary>Légende des types de classes</summary><div id="cha-legend-items" class="cha-badges"></div><p>Bleu nuit : plusieurs types · Gris : non renseigné.</p></details><div class="count-bar" id="cbar">—</div>
    <div class="list" id="list"></div>
  </div>
</div>

<script>
const DATA_URL = 'data/classes-ha.json';
const LABEL    = 'Classe à horaires aménagés';
const norm = x=>String(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const escapeHtml=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COLOR    = '#7e3af2';
const TYPES = {
 'Musique':{label:'CHAM — Musique',color:'#2563eb'},
 'Danse':{label:'CHAD — Danse',color:'#db2777'},
 'Théâtre':{label:'CHAT — Théâtre',color:'#ea580c'},
 'Arts plastiques':{label:'CHAAP — Arts plastiques',color:'#07876c'},
 'Cinéma':{label:'CHA — Cinéma',color:'#7c3aed'},
 'Arts et métiers du spectacle':{label:'CHAAMS — Arts et métiers du spectacle',color:'#087c99'},
 'Mathématiques et sciences':{label:'CHAMS — Mathématiques et sciences',color:'#927115'},
 'Autre CHA':{label:'Autre CHA',color:'#64748b'}
};
const typeLabel=spec=>TYPES[spec]?.label||spec;
function typeBadges(e){return (e.specialites?.length?e.specialites:['Non renseigné']).map(spec=>'<span class="cha-badge" style="--cha-color:'+(TYPES[spec]?.color||'#64748b')+'">'+escapeHtml(typeLabel(spec))+'</span>').join('')}
function markerColor(e){const selected=document.getElementById('specialite').value;if(selected&&TYPES[selected])return TYPES[selected].color;return e.specialites?.length>1?'#19224e':TYPES[e.specialites?.[0]]?.color||'#64748b'}


const map = L.map('map').setView([46.6, 2.3], 6);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  maxZoom: 19
}).addTo(map);

// Adapter Leaflet à la navigation commune et aux changements de taille.
let resizeFrame;
function resizeMap() {
  cancelAnimationFrame(resizeFrame);
  resizeFrame = requestAnimationFrame(() => map.invalidateSize({pan:false,debounceMoveend:true}));
}
if ('ResizeObserver' in window) new ResizeObserver(resizeMap).observe(map.getContainer());
else window.addEventListener('resize', resizeMap);

const markerLayer = L.layerGroup().addTo(map);
let allData = [], markers = {};

function mkIcon(e) {
  return L.divIcon({
    className: '',
    html: `<div style="width:10px;height:10px;border-radius:50%;background:${markerColor(e)};border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.35)"></div>`,
    iconSize: [10, 10], iconAnchor: [5, 5]
  });
}

function mkPopup(e) {
  const contact = [
    e.tel  ? `📞 <a href="tel:${e.tel}">${e.tel}</a>` : '',
    e.mail ? `✉️ <a href="mailto:${e.mail}">${e.mail}</a>` : '',
    e.web  ? `🌐 <a href="${e.web}" target="_blank">Site web</a>` : '',
  ].filter(Boolean).join('');

  return `
    <div class="pu-title">${escapeHtml(e.nom)}</div>
    <div class="cha-badges">${typeBadges(e)}</div>
    <div class="pu-info">
      ${e.adr ? escapeHtml(e.adr) + '<br>' : ''}${escapeHtml(e.cp)} ${escapeHtml(e.ville)}
    </div>
    ${contact ? `<div class="pu-contact">${contact}</div>` : ''}
    ${e.source ? `<div class="pu-info" style="font-size:.7rem;margin-top:8px">Source : ${escapeHtml(e.source)}</div>` : ''}
  `;
}

function filtered() {
  const q    = norm(document.getElementById('q').value.trim());
  const dept = document.getElementById('dept').value;
  return allData.filter(e =>
    (!q    || norm([e.nom,e.ville,e.uai].join(' ')).includes(q)) &&
    (!dept || e.dept === dept) &&
    (!document.getElementById('specialite').value || (e.specialites||[]).includes(document.getElementById('specialite').value))
  );
}

function render(data) {
  markerLayer.clearLayers(); markers = {};

  data.forEach(e => {
    const m = L.marker([e.lat, e.lng], { icon:mkIcon(e) });
    m.bindPopup(mkPopup(e), { maxWidth: 280 });
    markerLayer.addLayer(m);
    markers[e.uai] = m;
  });

  const list = document.getElementById('list');
  document.getElementById('cbar').textContent =
    `${data.length} établissement${data.length > 1 ? 's' : ''}`;

  if (!data.length) {
    list.innerHTML = '<div class="empty">Aucun résultat.</div>';
    return;
  }

  list.innerHTML = data.map(e =>
    `<div class="item" data-uai="${e.uai}">
      <div class="iname">${escapeHtml(e.nom)}</div>
      <div class="iloc">${escapeHtml(e.cp)} ${escapeHtml(e.ville)}${e.tel ? ' · ' + escapeHtml(e.tel) : ''}</div><div class="cha-badges">${typeBadges(e)}</div>
    </div>`
  ).join('');

  list.querySelectorAll('.item').forEach(el => {
    el.addEventListener('click', () => {
      const m = markers[el.dataset.uai];
      if (m) { map.flyTo(m.getLatLng(), 14, { duration: .7 }); m.openPopup(); }
      list.querySelectorAll('.item').forEach(i => i.classList.remove('active'));
      el.classList.add('active');
    });
  });
}

function applyFilters(reframe = false) {
  const data = filtered();
  render(data);
  if (reframe === true) {
    const points = data.filter(e => Number.isFinite(e.lat) && Number.isFinite(e.lng)).map(e => [e.lat,e.lng]);
    resizeMap();
    if (points.length === 1) map.setView(points[0], 12);
    else if (points.length > 1) map.fitBounds(points, {padding:[30,30],maxZoom:12});
  }
}


document.getElementById('cha-legend-items').innerHTML=typeBadges({specialites:Object.keys(TYPES)});
const notice=document.getElementById('data-notice');
function setNotice(message){notice.textContent=message;notice.hidden=false}
function setupData(data,source){
 allData=data;
 const depts=[...new Set(allData.map(e=>e.dept).filter(Boolean))].sort();
 const specs=[...new Set(allData.flatMap(e=>e.specialites||[]))].sort((a,b)=>a.localeCompare(b,'fr'));
 const fill=(id,items,label)=>{const select=document.getElementById(id);select.replaceChildren(new Option(label,''));items.forEach(v=>select.add(new Option(id==='dept'?'Dépt. '+v:typeLabel(v),v)))};
 fill('dept',depts,'Tous les départements');fill('specialite',specs,'Toutes les spécialités');
 document.getElementById('hcount').textContent=allData.length+' établissements référencés';
 setNotice(source);applyFilters(true);document.getElementById('loading').style.display='none';
}
let loadingNational=false;
async function loadNational(file){
 if(loadingNational)return;loadingNational=true;const btn=document.getElementById('cha-refresh');btn.disabled=true;
 const previous=allData.slice();setNotice('Chargement du catalogue national Onisep… la base locale reste disponible.');
 try{const result=await PortalOnisep.load('cha',previous,file);setupData(result.rows,'Catalogue Onisep (ODbL) et compléments locaux : '+result.rows.length+' établissements ; '+result.unlocated+' lignes sans coordonnées. Recensement non exhaustif.');}
 catch(err){setNotice('Import national non abouti : '+err.message+'. Inventaire local conservé. Téléchargez le GeoJSON depuis la source officielle pour l’importer manuellement.');}
 finally{btn.disabled=false;loadingNational=false}
}
document.getElementById('cha-refresh').addEventListener('click',()=>loadNational());
document.getElementById('cha-file').addEventListener('change',e=>{if(e.target.files[0])loadNational(e.target.files[0])});
document.getElementById('q').addEventListener('input',()=>applyFilters());
document.getElementById('dept').addEventListener('change',()=>applyFilters(true));
document.getElementById('specialite').addEventListener('change',()=>applyFilters(true));
(async()=>{try{const res=await fetch(DATA_URL,{cache:'no-cache'});if(!res.ok)throw Error('HTTP '+res.status);setupData(await res.json(),'Inventaire local partiel : établissements repérés dans les listes Onisep et rapprochés du référentiel géographique. Actualisation nationale en cours.');if(allData.length<400)loadNational();}catch(err){document.getElementById('loading').textContent='Données indisponibles : '+err.message;}})();
</script>
</body>
</html>
