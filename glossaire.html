<style>
:root{
  --navy:#1a3a5c; --sky:#2563eb; --sky-soft:#eff6ff;
  --amber:#d97706; --teal:#0d9488;
  --ink:#0f172a; --ink2:#334155; --muted:#64748b;
  --rule:#e2e8f0; --surface:#f8fafc; --white:#fff;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',system-ui,sans-serif;background:var(--surface);color:var(--ink);min-height:100vh;}

header{background:var(--navy);padding:0 24px;height:52px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100;}
.back-btn{display:inline-flex;align-items:center;gap:5px;color:rgba(255,255,255,.7);text-decoration:none;font-size:.78rem;font-weight:500;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:6px;padding:5px 12px;}
.back-btn:hover{background:rgba(255,255,255,.2);}
.header-title{font-family:'Space Grotesk',sans-serif;font-size:.95rem;font-weight:700;color:#fff;}
.header-count{font-size:.72rem;color:rgba(255,255,255,.45);margin-left:auto;}

/* BARRE DE RECHERCHE */
.search-bar{background:var(--white);border-bottom:1px solid var(--rule);padding:16px 24px;display:flex;gap:12px;align-items:center;position:sticky;top:52px;z-index:99;}
.search-wrap{position:relative;flex:1;max-width:480px;}
.search-wrap input{width:100%;height:40px;border:2px solid var(--rule);border-radius:10px;padding:0 14px 0 40px;font-size:.9rem;font-family:'Inter',sans-serif;color:var(--ink);outline:none;transition:border-color .15s;}
.search-wrap input:focus{border-color:var(--sky);}
.search-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.9rem;pointer-events:none;}
.clear-btn{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--muted);font-size:.85rem;display:none;}
.clear-btn.visible{display:block;}
.result-info{font-size:.78rem;color:var(--muted);white-space:nowrap;}
.result-info strong{color:var(--ink);font-weight:700;}

/* FILTRES ALPHABET */
.alpha-bar{background:var(--white);border-bottom:1px solid var(--rule);padding:8px 24px;display:flex;flex-wrap:wrap;gap:4px;position:sticky;top:105px;z-index:98;}
.alpha-btn{height:28px;min-width:28px;padding:0 6px;border:1.5px solid var(--rule);border-radius:6px;background:var(--white);font-size:.75rem;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;color:var(--muted);transition:all .1s;}
.alpha-btn:hover{border-color:var(--sky);color:var(--sky);}
.alpha-btn.active{background:var(--navy);border-color:var(--navy);color:#fff;}
.alpha-btn.disabled{opacity:.3;cursor:default;pointer-events:none;}
.alpha-sep{width:1px;background:var(--rule);margin:0 2px;}

/* CONTENU */
.content{max-width:900px;margin:0 auto;padding:24px 24px 48px;}

/* SECTIONS PAR LETTRE */
.letter-section{margin-bottom:8px;}
.letter-header{display:flex;align-items:center;gap:12px;margin-bottom:10px;padding-top:16px;}
.letter-title{font-family:'Space Grotesk',sans-serif;font-size:1.4rem;font-weight:700;color:var(--navy);width:36px;}
.letter-rule{flex:1;height:1px;background:var(--rule);}

/* CARTES */
.entries-grid{display:grid;gap:8px;}
.entry{background:var(--white);border:1.5px solid var(--rule);border-radius:10px;padding:12px 16px;display:flex;gap:14px;align-items:flex-start;transition:border-color .15s, box-shadow .15s;}
.entry:hover{border-color:#bfdbfe;box-shadow:0 2px 8px rgba(37,99,235,.08);}
.entry-sigle{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:.88rem;color:var(--sky);min-width:90px;flex-shrink:0;line-height:1.4;word-break:break-word;}
.entry-def{font-size:.82rem;color:var(--ink2);line-height:1.5;}
.entry.highlight .entry-sigle{color:var(--amber);}
.entry.highlight{border-color:#fde68a;background:#fffbeb;}

/* Surbrillance recherche */
mark{background:#fef08a;color:var(--ink);border-radius:2px;padding:0 1px;}

.empty{padding:48px 24px;text-align:center;color:var(--muted);}
.empty-icon{font-size:2rem;margin-bottom:8px;}

@media(max-width:600px){
  .search-bar{padding:12px 14px;}
  .alpha-bar{padding:6px 14px;top:100px;}
  .content{padding:16px 14px 32px;}
  .entry{flex-direction:column;gap:4px;}
  .entry-sigle{min-width:auto;}
}
</style>
</head>

anisation des Nations unies pour l'éducation, la science et la culture)"},{"sigle":"UNI","definition":"Union nationale inter-universitaire"},{"sigle":"UNICEF","definition":"United Nations international children's emergency fund (fonds des Nations unies d'aide à l'enfance)"},{"sigle":"UNL","definition":"Union nationale lycéenne"},{"sigle":"UNSA","definition":"Union nationale des syndicats autonomes"},{"sigle":"UNSS","definition":"Union nationale du sport scolaire"},{"sigle":"UPI","definition":"Unité pédagogique d'intégration"},{"sigle":"USEP","definition":"Union sportive de l'enseignement du premier degré"},{"sigle":"UT","definition":"Université technologique"},{"sigle":"UV","definition":"Unité de valeur"},{"sigle":"VAE","definition":"Validation des acquis de l'expérience"},{"sigle":"VEI","definition":"Ville - école - intégration"},{"sigle":"VERCORS","definition":"Gestion des consultations collectives (groupements d'achats) (application informatique)"},{"sigle":"VS","definition":"Vie scolaire"},{"sigle":"ZEP","definition":"Zone d'éducation prioritaire"}];

const LETTERS = [...new Set(DATA.map(e => e.sigle[0].toUpperCase()))].sort();
let activeLettre = null;
let searchTimer = null;

// ── ALPHABET ──────────────────────────────────────────────────────────────
function buildAlphaBar() {
  const bar = document.getElementById('alpha-bar');
  const allBtn = document.createElement('button');
  allBtn.className = 'alpha-btn active';
  allBtn.textContent = 'Tout';
  allBtn.id = 'alpha-all';
  allBtn.onclick = () => { activeLettre = null; updateAlpha(); render(); };
  bar.appendChild(allBtn);

  const sep = document.createElement('div');
  sep.className = 'alpha-sep';
  bar.appendChild(sep);

  'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach(l => {
    const btn = document.createElement('button');
    btn.className = 'alpha-btn' + (LETTERS.includes(l) ? '' : ' disabled');
    btn.textContent = l;
    btn.id = `alpha-${l}`;
    btn.onclick = () => { activeLettre = l; clearSearch(false); updateAlpha(); render(); };
    bar.appendChild(btn);
  });
}

function updateAlpha() {
  document.querySelectorAll('.alpha-btn').forEach(b => b.classList.remove('active'));
  const id = activeLettre ? `alpha-${activeLettre}` : 'alpha-all';
  document.getElementById(id)?.classList.add('active');
}

// ── RENDER ────────────────────────────────────────────────────────────────
function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function highlight(text, q) {
  if (!q) return esc(text);
  const safe = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return esc(text).replace(new RegExp(`(${safe})`, 'gi'), '<mark>$1</mark>');
}

function render() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  let filtered = DATA;

  if (activeLettre) {
    filtered = filtered.filter(e => e.sigle[0].toUpperCase() === activeLettre);
  }
  if (q.length >= 2) {
    filtered = filtered.filter(e =>
      e.sigle.toLowerCase().includes(q) || e.definition.toLowerCase().includes(q)
    );
  }

  // Compter
  document.getElementById('hcount').textContent = `${filtered.length} / ${DATA.length} sigles`;
  document.getElementById('result-info').innerHTML = q || activeLettre
    ? `<strong>${filtered.length}</strong> résultat${filtered.length > 1 ? 's' : ''}`
    : `<strong>${DATA.length}</strong> sigles · ${LETTERS.length} lettres`;

  const content = document.getElementById('content');

  if (!filtered.length) {
    content.innerHTML = `<div class="empty"><div class="empty-icon">🔎</div>Aucun résultat pour "<strong>${esc(q)}</strong>"</div>`;
    return;
  }

  // Grouper par lettre
  const byLetter = {};
  filtered.forEach(e => {
    const l = e.sigle[0].toUpperCase();
    if (!byLetter[l]) byLetter[l] = [];
    byLetter[l].push(e);
  });

  content.innerHTML = Object.keys(byLetter).sort().map(letter => {
    const entries = byLetter[letter];
    const entriesHTML = entries.map(e => {
      const sigleHL = highlight(e.sigle, q);
      const defHL = highlight(e.definition, q);
      const isMatch = q && (e.sigle.toLowerCase().includes(q) && !e.definition.toLowerCase().includes(q));
      return `<div class="entry${isMatch ? ' highlight' : ''}">
        <div class="entry-sigle">${sigleHL}</div>
        <div class="entry-def">${defHL}</div>
      </div>`;
    }).join('');
    return `<div class="letter-section" id="section-${letter}">
      <div class="letter-header">
        <div class="letter-title">${letter}</div>
        <div class="letter-rule"></div>
        <span style="font-size:.7rem;color:var(--muted)">${entries.length}</span>
      </div>
      <div class="entries-grid">${entriesHTML}</div>
    </div>`;
  }).join('');
}

function clearSearch(rerender = true) {
  document.getElementById('q').value = '';
  document.getElementById('clear-btn').classList.remove('visible');
  if (rerender) render();
}

// ── EVENTS ────────────────────────────────────────────────────────────────
document.getElementById('q').addEventListener('input', function() {
  document.getElementById('clear-btn').classList.toggle('visible', this.value.length > 0);
  // Désactiver filtre lettre si on tape
  if (this.value.length > 0 && activeLettre) {
    activeLettre = null;
    updateAlpha();
  }
  clearTimeout(searchTimer);
  searchTimer = setTimeout(render, 200);
});

// ── INIT ──────────────────────────────────────────────────────────────────
buildAlphaBar();
render();
</script>
