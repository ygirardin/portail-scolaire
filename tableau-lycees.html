<head>

<style>
:root{--navy:#1a3a5c;--sky:#2563eb;--sky-soft:#eff6ff;--teal:#0d9488;--violet:#7c3aed;--ink:#0f172a;--ink2:#334155;--muted:#64748b;--rule:#e2e8f0;--surface:#f8fafc;--white:#fff;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',system-ui,sans-serif;background:var(--surface);color:var(--ink);font-size:14px;}
header{background:var(--navy);padding:0 24px;height:52px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100;box-shadow:0 1px 0 rgba(255,255,255,.08);}
.back-btn{display:inline-flex;align-items:center;gap:5px;color:rgba(255,255,255,.7);text-decoration:none;font-size:.78rem;font-weight:500;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:6px;padding:5px 12px;transition:background .15s;}
.back-btn:hover{background:rgba(255,255,255,.18);}
.header-title{font-family:'Space Grotesk',sans-serif;font-size:.95rem;font-weight:700;color:#fff;}
.header-sub{font-size:.72rem;color:rgba(255,255,255,.45);margin-left:auto;}
.controls{background:var(--white);border-bottom:1px solid var(--rule);padding:14px 24px;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;}
.ctrl{display:flex;flex-direction:column;gap:4px;}
.ctrl label{font-size:.68rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}
.ctrl input,.ctrl select{height:34px;border:1.5px solid var(--rule);border-radius:7px;padding:0 10px;font-size:.82rem;font-family:'Inter',sans-serif;color:var(--ink);background:var(--surface);outline:none;transition:border-color .15s;}
.ctrl input{min-width:220px;}
.ctrl select{min-width:150px;}
.ctrl input:focus,.ctrl select:focus{border-color:var(--sky);}
.btn-reset{height:34px;padding:0 14px;background:var(--navy);color:#fff;border:none;border-radius:7px;font-size:.8rem;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;}
.btn-reset:hover{background:#1e4080;}
.results-bar{padding:10px 24px;font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--rule);background:var(--white);}
.count-badge{background:var(--violet);color:#fff;border-radius:100px;padding:2px 10px;font-size:.72rem;font-weight:700;}
.table-wrap{overflow-x:auto;padding:0 24px 40px;}
table{width:100%;border-collapse:collapse;margin-top:16px;font-size:.78rem;}
thead tr{background:var(--navy);color:#fff;}
th{padding:9px 10px;text-align:left;font-weight:600;font-size:.72rem;letter-spacing:.04em;white-space:nowrap;cursor:pointer;user-select:none;}
th:hover{background:#1e4080;}
tbody tr{border-bottom:1px solid var(--rule);}
tbody tr:hover{background:var(--sky-soft);}
td{padding:7px 10px;white-space:nowrap;color:var(--ink2);}
td.nom{font-weight:500;color:var(--ink);max-width:240px;overflow:hidden;text-overflow:ellipsis;}
td.num{text-align:right;font-variant-numeric:tabular-nums;}
.badge{display:inline-block;border-radius:4px;padding:2px 7px;font-size:.67rem;font-weight:700;text-transform:uppercase;}
.badge-pub{background:#dbeafe;color:#1d4ed8;}
.badge-pri{background:#fce7f3;color:#9d174d;}
.badge-gt{background:#f0fdf4;color:#15803d;}
.badge-pro{background:#fff7ed;color:#c2410c;}
.badge-lpo{background:#f5f3ff;color:#6d28d9;}
.ips-bar{display:inline-block;height:6px;border-radius:3px;vertical-align:middle;margin-right:5px;}
.pagination{display:flex;align-items:center;gap:6px;padding:12px 24px;justify-content:center;}
.page-btn{height:30px;min-width:30px;padding:0 8px;border:1.5px solid var(--rule);border-radius:6px;background:var(--white);font-size:.78rem;cursor:pointer;font-family:'Inter',sans-serif;color:var(--ink2);}
.page-btn:hover{border-color:var(--sky);color:var(--sky);}
.page-btn.active{background:var(--violet);border-color:var(--violet);color:#fff;font-weight:600;}
.page-btn:disabled{opacity:.4;cursor:not-allowed;}
</style>
</head>

const PER_PAGE=50;
let filtered=[],sortCol='total',sortDir=-1,page=1;
function esc(s){const d=document.createElement('div');d.textContent=String(s||'');return d.innerHTML;}
function getIpsColor(v){if(!v||isNaN(v))return'#cbd5e1';const n=parseFloat(v);if(n<80)return'#ef4444';if(n<95)return'#f97316';if(n<110)return'#eab308';if(n<125)return'#22c55e';return'#16a34a';}
function initFilters(){
  const acads=[...new Set(RAW.map(r=>r.academie).filter(Boolean))].sort();
  const s=document.getElementById('sel-academie');
  acads.forEach(a=>{const o=document.createElement('option');o.value=a;o.textContent=a;s.appendChild(o);});
  const depts=[...new Set(RAW.map(r=>r.departement).filter(Boolean))].sort();
  const s2=document.getElementById('sel-dept');
  depts.forEach(d=>{const o=document.createElement('option');o.value=d;o.textContent=d;s2.appendChild(o);});
}
function applyFilters(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const acad=document.getElementById('sel-academie').value;
  const dept=document.getElementById('sel-dept').value;
  const type=document.getElementById('sel-type').value;
  const sect=document.getElementById('sel-secteur').value;
  filtered=RAW.filter(r=>{
    if(q&&!(r.nom+' '+r.commune+' '+r.departement).toLowerCase().includes(q))return false;
    if(acad&&r.academie!==acad)return false;
    if(dept&&r.departement!==dept)return false;
    if(type&&r.type!==type)return false;
    if(sect&&r.secteur!==sect)return false;
    return true;
  });
  filtered.sort((a,b)=>{
    let va=a[sortCol]||'',vb=b[sortCol]||'';
    if(['total','seconde','premiere','terminale','ips'].includes(sortCol)){va=parseFloat(va)||0;vb=parseFloat(vb)||0;}
    return va<vb?sortDir:va>vb?-sortDir:0;
  });
  page=1;render();
}
function render(){
  document.getElementById('count').textContent=filtered.length;
  const slice=filtered.slice((page-1)*PER_PAGE,page*PER_PAGE);
  const typeClass={'GT':'badge-gt','PRO':'badge-pro','GT+PRO':'badge-lpo'};
  document.getElementById('tbody').innerHTML=slice.map(r=>{
    const ipsVal=parseFloat(r.ips);
    const ipsDisplay=r.ips?`<span class="ips-bar" style="width:${Math.min(Math.max((ipsVal-60)/100*40,2),40)}px;background:${getIpsColor(r.ips)}"></span>${ipsVal.toFixed(1)}`:'—';
    return`<tr>
      <td class="nom" title="${esc(r.denom)}">${esc(r.nom||r.denom)}</td>
      <td><span class="badge ${typeClass[r.type]||''}">${esc(r.type)}</span></td>
      <td>${esc(r.academie)}</td><td>${esc(r.departement)}</td><td>${esc(r.commune)}</td>
      <td><span class="badge ${r.secteur==='PUBLIC'?'badge-pub':'badge-pri'}">${esc(r.secteur)}</span></td>
      <td class="num">${r.total||'—'}</td><td class="num">${r.seconde||'—'}</td>
      <td class="num">${r.premiere||'—'}</td><td class="num">${r.terminale||'—'}</td>
      <td class="num">${ipsDisplay}</td>
    </tr>`;
  }).join('');
  renderPagination();
}
function renderPagination(){
  const total=Math.ceil(filtered.length/PER_PAGE);
  if(total<=1){document.getElementById('pagination').innerHTML='';return;}
  let html=`<button class="page-btn" onclick="goPage(${page-1})" ${page===1?'disabled':''}>‹</button>`;
  let start=Math.max(1,page-2),end=Math.min(total,start+4);
  if(start>1)html+=`<button class="page-btn" onclick="goPage(1)">1</button>${start>2?'<span>…</span>':''}`;
  for(let p=start;p<=end;p++)html+=`<button class="page-btn ${p===page?'active':''}" onclick="goPage(${p})">${p}</button>`;
  if(end<total)html+=`${end<total-1?'<span>…</span>':''}<button class="page-btn" onclick="goPage(${total})">${total}</button>`;
  html+=`<button class="page-btn" onclick="goPage(${page+1})" ${page===total?'disabled':''}>›</button>`;
  document.getElementById('pagination').innerHTML=html;
}
function goPage(p){page=p;render();window.scrollTo(0,0);}
function sortBy(col){if(sortCol===col)sortDir*=-1;else{sortCol=col;sortDir=-1;}applyFilters();}
function resetFilters(){['q','sel-academie','sel-dept','sel-type','sel-secteur'].forEach(id=>document.getElementById(id).value='');applyFilters();}
['q','sel-academie','sel-dept','sel-type','sel-secteur'].forEach(id=>{
  document.getElementById(id).addEventListener('input',()=>{page=1;applyFilters();});
  document.getElementById(id).addEventListener('change',()=>{page=1;applyFilters();});
});
initFilters();applyFilters();
