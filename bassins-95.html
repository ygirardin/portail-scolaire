<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --navy:#1a3a5c; --sky:#2563eb; --sky-soft:#eff6ff;
  --ink:#0f172a; --ink2:#334155; --muted:#64748b;
  --rule:#e2e8f0; --surface:#f8fafc; --white:#fff;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',system-ui,sans-serif;background:var(--surface);color:var(--ink);height:100vh;display:flex;flex-direction:column;}

header{background:var(--navy);padding:0 20px;height:52px;display:flex;align-items:center;gap:14px;flex-shrink:0;z-index:1000;}
.back-btn{display:inline-flex;align-items:center;gap:5px;color:rgba(255,255,255,.7);text-decoration:none;font-size:.78rem;font-weight:500;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:6px;padding:5px 12px;transition:background .15s;}
.back-btn:hover{background:rgba(255,255,255,.2);}
.header-title{font-family:'Space Grotesk',sans-serif;font-size:.95rem;font-weight:700;color:#fff;}
.header-sub{font-size:.72rem;color:rgba(255,255,255,.45);margin-left:auto;}

.layout{display:flex;flex:1;overflow:hidden;}

/* MAP */
#map{flex:1;z-index:1;}

/* PANEL LATÉRAL */
#panel{width:380px;flex-shrink:0;background:var(--white);border-left:1px solid var(--rule);display:flex;flex-direction:column;overflow:hidden;transition:width .25s;}
#panel.hidden{width:0;}

.panel-header{padding:16px;border-bottom:1px solid var(--rule);flex-shrink:0;}
.panel-bassin-name{font-family:'Space Grotesk',sans-serif;font-size:1.05rem;font-weight:700;color:var(--ink);}
.panel-bassin-bar{height:4px;border-radius:2px;margin-top:8px;}
.panel-desc{font-size:.75rem;color:var(--muted);margin-top:6px;line-height:1.5;}
.panel-count{font-size:.75rem;font-weight:600;margin-top:6px;}

.panel-search{padding:10px 16px;border-bottom:1px solid var(--rule);flex-shrink:0;}
.panel-search input{width:100%;height:32px;border:1.5px solid var(--rule);border-radius:7px;padding:0 10px;font-size:.8rem;font-family:'Inter',sans-serif;color:var(--ink);outline:none;}
.panel-search input:focus{border-color:var(--sky);}

.panel-filters{padding:8px 16px;border-bottom:1px solid var(--rule);display:flex;gap:6px;flex-shrink:0;}
.filter-btn{height:26px;padding:0 10px;border:1.5px solid var(--rule);border-radius:100px;font-size:.7rem;font-weight:600;cursor:pointer;background:var(--white);color:var(--muted);font-family:'Inter',sans-serif;transition:all .15s;}
.filter-btn.active{background:var(--navy);border-color:var(--navy);color:#fff;}

.panel-list{flex:1;overflow-y:auto;padding:8px 0;}

.etab-card{padding:12px 16px;border-bottom:1px solid var(--rule);cursor:default;transition:background .1s;}
.etab-card:hover{background:var(--sky-soft);}
.etab-type{display:inline-block;font-size:.62rem;font-weight:700;padding:2px 6px;border-radius:4px;text-transform:uppercase;margin-bottom:4px;}
.type-clg{background:#dbeafe;color:#1d4ed8;}
.type-lgt{background:#f0fdf4;color:#15803d;}
.type-lpo{background:#f5f3ff;color:#6d28d9;}
.type-lp{background:#fff7ed;color:#c2410c;}
.type-erea,.type-cfa{background:#fef3c7;color:#92400e;}
.etab-nom{font-weight:600;font-size:.82rem;color:var(--ink);line-height:1.3;}
.etab-uai{font-size:.68rem;color:var(--muted);margin-left:5px;font-weight:400;}
.etab-adr{font-size:.73rem;color:var(--ink2);margin-top:3px;}
.etab-contacts{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px;}
.etab-chef{font-size:.72rem;color:var(--muted);width:100%;}
.contact-link{display:inline-flex;align-items:center;gap:3px;font-size:.7rem;color:var(--sky);text-decoration:none;background:var(--sky-soft);border-radius:4px;padding:2px 7px;}
.contact-link:hover{background:#bfdbfe;}

.panel-empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:.82rem;}

/* LEGEND */
.legend{background:var(--white);border-radius:8px;padding:10px 12px;box-shadow:0 2px 8px rgba(0,0,0,.12);line-height:1.6;}
.legend h4{font-family:'Space Grotesk',sans-serif;font-size:.75rem;font-weight:700;color:var(--ink);margin-bottom:6px;}
.legend-item{display:flex;align-items:center;gap:7px;font-size:.72rem;color:var(--ink2);cursor:pointer;padding:2px 0;}
.legend-item:hover{color:var(--ink);}
.legend-dot{width:14px;height:14px;border-radius:3px;flex-shrink:0;}

/* TOOLTIP MAP */
.bassin-tooltip{font-family:'Inter',sans-serif;font-weight:600;font-size:.82rem;padding:6px 10px;}

/* Close btn */
.panel-close{margin-left:auto;width:28px;height:28px;border:none;background:var(--surface);border-radius:6px;cursor:pointer;font-size:1rem;color:var(--muted);display:flex;align-items:center;justify-content:center;}
.panel-close:hover{background:var(--rule);}

@media(max-width:768px){
  .layout{flex-direction:column;}
  #map{height:55vh;}
  #panel{width:100%;border-left:none;border-top:1px solid var(--rule);height:45vh;}
}
</style>
</head>

// ── CARTE ────────────────────────────────────────────────────────────────────
const map = L.map('map', {zoomControl:true}).setView([49.05, 2.18], 10);

L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  attribution:'© OpenStreetMap © CARTO',
  maxZoom:18
}).addTo(map);

// Légende
const legend = L.control({position:'bottomleft'});
legend.onAdd = () => {
  const div = L.DomUtil.create('div','legend');
  div.innerHTML = '<h4>Bassins d\'éducation</h4>' +
    BASSINS_GEO.features.map(f =>
      `<div class="legend-item" onclick="selectBassin('${f.properties.nom}')">
        <div class="legend-dot" style="background:${f.properties.color}"></div>
        ${f.properties.nom}
      </div>`
    ).join('');
  return div;
};
legend.addTo(map);

// ── POLYGONES ────────────────────────────────────────────────────────────────
let activeLayer = null;
const layers = {};

BASSINS_GEO.features.forEach(feature => {
  const nom = feature.properties.nom;
  const color = feature.properties.color;

  const layer = L.geoJSON(feature, {
    style: {
      color: color,
      weight: 2.5,
      opacity: 0.9,
      fillColor: color,
      fillOpacity: 0.18
    }
  });

  layer.on('mouseover', function(e) {
    if (activeBassin !== nom) {
      e.target.setStyle({fillOpacity: 0.32, weight: 3});
    }
    L.popup({closeButton:false, offset:[0,-5]})
      .setLatLng(e.latlng)
      .setContent(`<div class="bassin-tooltip" style="color:${color}">${nom}</div>`)
      .openOn(map);
  });

  layer.on('mouseout', function(e) {
    if (activeBassin !== nom) {
      e.target.setStyle({fillOpacity: 0.18, weight: 2.5});
    }
    map.closePopup();
  });

  layer.on('click', function() {
    selectBassin(nom);
  });

  layer.addTo(map);
  layers[nom] = layer;
});

// ── PANEL ────────────────────────────────────────────────────────────────────
let activeBassin = null;
let activeFilter = 'all';

function selectBassin(nom) {
  // Reset ancien bassin
  if (activeBassin && layers[activeBassin]) {
    const oldColor = BASSINS_GEO.features.find(f=>f.properties.nom===activeBassin)?.properties.color;
    layers[activeBassin].setStyle({fillOpacity:0.18, weight:2.5, color:oldColor});
  }

  activeBassin = nom;
  const feature = BASSINS_GEO.features.find(f=>f.properties.nom===nom);
  const color = feature.properties.color;

  // Surligner le bassin sélectionné
  layers[nom].setStyle({fillOpacity:0.35, weight:3.5, color:color});

  // Mettre à jour le panel
  document.getElementById('panel-name').textContent = nom;
  document.getElementById('panel-bar').style.background = color;
  document.getElementById('panel-desc').textContent = feature.properties.desc;

  const etabsBassin = ETABS.filter(e => e.bassin === nom);
  document.getElementById('panel-count').innerHTML =
    `<span style="color:${color}">${etabsBassin.length} établissements</span>`;

  document.getElementById('panel-q').value = '';
  activeFilter = 'all';
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('f-all').classList.add('active');

  document.getElementById('panel').classList.remove('hidden');
  renderList();

  // Zoom sur le bassin
  map.fitBounds(layers[nom].getBounds(), {padding:[40,40]});
}

function closePanel() {
  if (activeBassin && layers[activeBassin]) {
    const color = BASSINS_GEO.features.find(f=>f.properties.nom===activeBassin)?.properties.color;
    layers[activeBassin].setStyle({fillOpacity:0.18, weight:2.5, color:color});
  }
  activeBassin = null;
  document.getElementById('panel').classList.add('hidden');
}

function setFilter(f) {
  activeFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('f-'+f.toLowerCase().replace('lgt','lgt').replace('lpo','lpo').replace('lp','lp').replace('all','all')).classList.add('active');
  renderList();
}

function renderList() {
  if (!activeBassin) return;
  const q = document.getElementById('panel-q').value.trim().toLowerCase();
  const list = document.getElementById('panel-list');

  let etabs = ETABS.filter(e => e.bassin === activeBassin);

  if (activeFilter !== 'all') {
    etabs = etabs.filter(e => e.type === activeFilter);
  }
  if (q) {
    etabs = etabs.filter(e =>
      (e.nom+' '+e.adresse).toLowerCase().includes(q)
    );
  }

  etabs.sort((a,b) => a.nom.localeCompare(b.nom));

  if (!etabs.length) {
    list.innerHTML = '<div class="panel-empty">Aucun établissement pour ces critères.</div>';
    return;
  }

  const typeClass = {
    'CLG':'type-clg','LGT':'type-lgt','LPO':'type-lpo',
    'LP':'type-lp','EREA':'type-erea','CFA':'type-cfa'
  };
  const typeLabel = {
    'CLG':'Collège','LGT':'Lycée GT','LPO':'LPO','LP':'Lycée Pro',
    'EREA':'EREA','CFA':'CFA',''   :'Établissement'
  };

  list.innerHTML = etabs.map(e => {
    const tc = typeClass[e.type] || 'type-clg';
    const tl = typeLabel[e.type] || e.type || '—';
    const mailHtml = e.mail ? `<a class="contact-link" href="mailto:${e.mail}">✉ ${e.mail}</a>` : '';
    const telHtml = e.tel ? `<a class="contact-link" href="tel:${e.tel.replace(/\s/g,'')}">📞 ${e.tel}</a>` : '';
    const siteHtml = e.site ? `<a class="contact-link" href="${e.site.startsWith('http')?e.site:'https://'+e.site}" target="_blank">🌐 Site</a>` : '';
    const chefHtml = e.chef ? `<div class="etab-chef">👤 ${e.chef}</div>` : '';
    return `<div class="etab-card">
      <span class="etab-type ${tc}">${tl}</span>
      <span class="etab-uai">${e.uai}</span>
      <div class="etab-nom">${e.nom}</div>
      <div class="etab-adr">📍 ${e.adresse||'—'}</div>
      <div class="etab-contacts">
        ${chefHtml}
        ${telHtml}${mailHtml}${siteHtml}
      </div>
    </div>`;
  }).join('');
}

// Init filtres boutons
const filterMap = {'all':'f-all','CLG':'f-clg','LGT':'f-lgt','LPO':'f-lpo','LP':'f-lp'};
