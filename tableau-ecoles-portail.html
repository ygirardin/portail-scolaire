<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#19224e">
  <title>Effectifs des écoles — Portail Scolaire</title>
  <meta name="description" content="Effectifs des écoles maternelles et élémentaires : consultation du tableau avec la charte graphique du Portail Scolaire.">
  <style>
    *,*::before,*::after{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,sans-serif;background:#f6f8fd}
    #schoolFrame{display:block;width:100%;height:100vh;height:100dvh;border:0;background:#f6f8fd;opacity:0;transition:opacity .15s}
    #loadScreen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(130deg,#19224e,#3c469e);color:white;text-align:center;z-index:2}
    .loading-card{width:min(100%,420px);padding:32px;border:1px solid rgba(255,255,255,.22);border-radius:22px;background:rgba(255,255,255,.1);box-shadow:0 18px 48px rgba(11,19,55,.17)}
    .loading-mark{display:grid;place-items:center;width:56px;height:56px;margin:0 auto 18px;background:#bff0a0;color:#23384b;border-radius:16px;font-weight:850}
    h1{font-size:1.27rem;margin:0 0 9px}p{font-size:.86rem;line-height:1.65;color:#dce2ff;margin:0 0 18px}
    .loading-line{height:5px;width:140px;overflow:hidden;background:rgba(255,255,255,.2);border-radius:20px;margin:0 auto 18px}
    .loading-line:after{content:'';display:block;width:44%;height:100%;background:#c5f6a1;border-radius:20px;animation:load 1.2s ease-in-out infinite alternate}
    .loading-card a{color:#d1ffb2;font-size:.78rem}
    @keyframes load{from{transform:translateX(-75%)}to{transform:translateX(260%)}}
    @media(prefers-reduced-motion:reduce){.loading-line:after{animation:none}}
  </style>
  <noscript><style>#schoolFrame{opacity:1}#loadScreen{display:none}</style></noscript>
</head>
<body>
  <iframe id="schoolFrame" title="Tableau des effectifs et IPS des écoles" src="tableau-ecoles.html" loading="eager"></iframe>
  <div id="loadScreen" role="status" aria-live="polite">
    <div class="loading-card">
      <div class="loading-mark">EDU</div>
      <h1>Effectifs des écoles</h1>
      <p>Ouverture du tableau des écoles maternelles et élémentaires…</p>
      <div class="loading-line" aria-hidden="true"></div>
      <a href="tableau-ecoles.html">Accéder directement au tableau original</a>
    </div>
  </div>
  <script>
    (function(){
      const frame = document.getElementById('schoolFrame');
      const loading = document.getElementById('loadScreen');
      const show = function(){ frame.style.opacity='1'; loading.hidden=true;loading.style.display='none'; };
      frame.addEventListener('load',function(){
        try {
          // Même origine : on applique uniquement la feuille de style et la navigation.
          const doc = frame.contentDocument;
          if(!doc || !doc.head) { show(); return; }
          doc.documentElement.setAttribute('data-portal-page','data');
          doc.querySelectorAll('a[href="index.html"]').forEach(a=>a.setAttribute('target','_top'));
          const link=doc.createElement('link');
          link.rel='stylesheet';
          link.href='portail-theme.css?v=20261118';
          link.addEventListener('load',show,{once:true});
          link.addEventListener('error',show,{once:true});
          doc.head.appendChild(link);
        } catch(error) { show(); }
      });
      frame.addEventListener('error',show);
    })();
  </script>
</body>
</html>
